name: CI

# Pre commit + pre merge gates. Catches regressions that would otherwise
# slip into release/v1.0 between commits. Every check below is cheap
# enough (sub 5 minutes) that running on every push is practical, and
# every failure here is a real bug, not a flaky test.
#
# These checks are intentionally NOT the full anchor integration test
# suite (those need Metaplex Token Metadata fixtures + bankrun setup;
# they live in scripts/factory_devnet_pause_drill.ts and friends, run
# manually before mainnet deploy via FACTORY_LAUNCH_RUNBOOK.md Step
# 4.5).

on:
  push:
    branches: [main, release/**, factory-v1]
  pull_request:
    branches: [main, release/**]

jobs:
  static-safety-guards:
    name: Static safety guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: unwrap is never pause-guarded
        run: bash scripts/check_unwrap_unguarded.sh

      - name: cluster flag lint (anchor vs solana mainnet name)
        run: bash scripts/cluster_flag_lint.sh

  rust-build-and-unit-tests:
    name: cargo check + cargo test --lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check workspace
        run: cargo check --workspace

      - name: cargo test --lib (tier + treasury accounting invariants)
        run: cargo test --lib -p wrappedfactory

  web-build:
    # Runs the actual production build pipeline. next build internally
    # runs tsc with web/next.config.js settings (which suppress known
    # React 18->19 wallet-adapter type drift via ignoreBuildErrors).
    # That is intentional and tracked; standalone `tsc --noEmit` would
    # fail on those vendor errors even though the deployed app is fine,
    # so CI mirrors what we actually ship.
    name: web next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: npm run build (fires prebuild -> sync-config -> next build)
        # MUST be `npm run build`, not `npx next build` — only the
        # former triggers npm's `prebuild` lifecycle hook that runs
        # `sync-config` to generate web/lib/launch-config.generated.ts
        # from config/launch.toml. Without it the bundler errors with
        # "Module not found: @/lib/launch-config.generated".
        run: npm run build
        env:
          NEXT_PUBLIC_DEBUG_TX: "0"

  sdk-typecheck:
    # SDK has no package-lock.json yet and known vendor type drift in
    # @solana/spl-token-group/codecs-data-structures (pre-existing,
    # tracked). We still run cargo check + tsc with errors allowed so a
    # NEW issue would still be visible in the run log, just not gating.
    name: sdk tsc (non-blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install
        run: npm install --no-fund --no-audit

      - name: tsc no-emit
        run: npx tsc --noEmit -p .
